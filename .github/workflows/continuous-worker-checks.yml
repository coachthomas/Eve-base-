name: Continuous worker checks
on:
  push:
    paths:
      - 'ops/continuous-worker/**'
      - '.github/workflows/continuous-worker-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s ops/continuous-worker/tests -v
      - run: PYTHONPATH=apps/lead-discovery python3 -m unittest discover -s apps/lead-discovery/tests -v
