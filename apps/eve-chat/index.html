<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eve | Energy Culture</title><style>body{background:#10171c;color:#f4f0e7;font:16px system-ui;margin:0}.wrap{max-width:740px;margin:auto;padding:24px}header{border-bottom:1px solid #52645f;padding-bottom:15px}h1{font-size:32px;margin:8px 0}small{color:#b5c4bf}#chat{height:58vh;overflow:auto;padding:16px 0}.bubble{white-space:pre-wrap;border-radius:16px;padding:13px 16px;margin:12px 0;max-width:88%}.user{background:#2c5851;margin-left:auto}.assistant{background:#253039}form{display:flex;gap:8px}textarea{flex:1;border:1px solid #62766e;background:#19252b;color:white;border-radius:12px;padding:12px;font:inherit;min-height:45px}button{background:#c0e4cf;color:#102419;border:0;border-radius:12px;font-weight:bold;padding:12px 22px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px;color:#d8c8a0}</style></head><body><div class="wrap"><header><small>ENERGY CULTURE • PRIVATE LOCAL PROTOTYPE</small><h1>Eve</h1><small>Text chat · local history · not a deployed production service</small></header><main id="chat" aria-live="polite"></main><p id="status"></p><form id="form"><textarea id="msg" aria-label="Message to Eve" placeholder="Talk to Eve…" required maxlength="4000"></textarea><button id="send">Send</button></form><p><small>History is stored on the computer running Eve. This prototype has no remote authentication. Do not expose it publicly or enter sensitive information.</small></p></div><script>const chat=document.getElementById('chat'),status=document.getElementById('status'),form=document.getElementById('form'),msg=document.getElementById('msg'),send=document.getElementById('send');function add(role,text){const p=document.createElement('div');p.className='bubble '+(role==='user'?'user':'assistant');p.textContent=text;chat.append(p);chat.scrollTop=chat.scrollHeight;}fetch('/api/history').then(r=>r.json()).then(d=>d.messages.forEach(x=>add(x.role,x.content))).catch(()=>status.textContent='Could not load history');form.onsubmit=async e=>{e.preventDefault();const t=msg.value.trim();if(!t)return;send.disabled=true;status.textContent='Asking local model…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const d=await r.json();if(!r.ok)throw Error(d.error);add('user',t);add('assistant',d.answer);msg.value='';status.textContent='Saved locally';}catch(e){status.textContent=e.message;}finally{send.disabled=false;}};</script></body></html>
