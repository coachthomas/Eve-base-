<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Culture · Opportunity Review</title>
<style>body{font:16px system-ui;background:#09192a;color:#ecf4ff;max-width:1100px;margin:32px auto;padding:0 18px}h1{color:#e7c477}p{color:#c3d2e4}form,.card{background:#132a43;border:1px solid #35516c;border-radius:14px;padding:22px;margin:20px 0}label{display:block;margin:14px 0 5px}input,textarea,select,button{font:inherit;padding:11px;border-radius:6px;border:1px solid #52708c}input,textarea{box-sizing:border-box;width:100%;background:#0a1d30;color:white}textarea{min-height:70px}button{background:#e7c477;color:#152132;cursor:pointer;margin-top:12px}select{background:#e6edf5}a{color:#9fd3ff}.badge{font-size:13px;color:#e7c477}.error{color:#ffb2a5}.row{display:flex;gap:15px;flex-wrap:wrap}.row>div{flex:1;min-width:220px}.muted{color:#b2c4d8;font-size:14px}</style>
<h1>Energy Culture · Opportunity Review</h1><p>Find the conversation. Understand the request. Choose the next step.</p><p class="muted">Private local workspace · Manual source intake · No messages sent</p>
<form id="intake"><h2>Add a real opportunity</h2><label>Original public post URL</label><input name="url" type="url" required><label>Supporting excerpt — the person's own words</label><textarea name="excerpt" required></textarea><label>What are they explicitly asking for?</label><textarea name="need" required></textarea><div class="row"><div><label>Potential offer fit</label><select name="fit"><option value="uncertain">Uncertain / review first</option><option value="genuine-self">Genuine Self · $150</option><option value="personalized">Fits Like a Glove · $400</option></select></div><div><label>Post date, if known</label><input name="published" type="date"></div></div><label>Evidence they want coaching or paid guidance (leave blank if unknown)</label><textarea name="intent"></textarea><button>Save for review</button><p id="message" role="status"></p></form>
<div class="row"><h2>Review queue</h2><div><label>Show</label><select id="filter"><option value="all">All outcomes</option><option>new</option><option>reviewed</option><option>contacted</option><option>replied</option><option>booked</option><option>paid</option><option>dismissed</option></select></div></div><p id="summary"></p><div id="queue"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['new','reviewed','contacted','replied','booked','paid','dismissed'];
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function refresh(){const rows=await(await fetch('/api/opportunities')).json();document.querySelector('#summary').textContent=`${rows.length} source-linked opportunities · ${rows.filter(r=>r.status==='paid').length} confirmed paid · $${rows.reduce((n,r)=>n+(r.status==='paid'?r.amount:0),0).toFixed(2)} recorded revenue`;const filter=document.querySelector('#filter').value;document.querySelector('#queue').innerHTML=rows.filter(r=>filter==='all'||r.status===filter).map(r=>`<article class="card"><span class="badge">${esc(r.fit)} · ${esc(r.status)}</span><h3>${esc(r.need)}</h3><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Review original source ↗</a><p>${esc(r.excerpt)}</p><p><b>Buying-intent evidence:</b> ${esc(r.intent)}</p><p class="muted">Published: ${esc(r.published||'Unknown')} · Retrieved: ${esc(r.retrieved.slice(0,10))}</p><form class="outcome" data-id="${r.id}"><label>Outcome</label><select name="status">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><label>Actual confirmed payment (USD, only for paid)</label><input name="amount" type="number" min="0.01" step="0.01" value="${esc(r.amount||'')}"><label>Review / payment confirmation and attribution notes</label><textarea name="notes">${esc(r.notes)}</textarea><button>Save outcome</button><p role="status"></p></form></article>`).join('')||'<p>No opportunities yet. Add a source above.</p>';}
document.querySelector('#intake').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#message');try{await post('/api/opportunities',Object.fromEntries(new FormData(e.target)));e.target.reset();m.textContent='Saved. Review the original source before responding.';await refresh();}catch(err){m.textContent=err.message;}};
document.querySelector('#queue').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await post('/api/outcome',{id:Number(f.dataset.id),...Object.fromEntries(new FormData(f))});await refresh();}catch(err){f.querySelector('[role=status]').textContent=err.message;}};
document.querySelector('#filter').onchange=refresh;refresh();
</script></html>
